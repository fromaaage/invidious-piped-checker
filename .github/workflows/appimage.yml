name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # oldest supported runner → AppImage runs on older distros too (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libegl1 libfuse2
      - name: Build
        run: packaging/build-appimage.sh "${GITHUB_REF_NAME}"
      - name: Smoke test
        run: |
          HOME=$(mktemp -d) QT_QPA_PLATFORM=offscreen timeout 30 dist/*.AppImage --no-autoscan || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.AppImage --title "$GITHUB_REF_NAME" --generate-notes
